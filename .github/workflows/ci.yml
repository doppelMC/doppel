name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  parity:
    name: parity - ${{ matrix.gate }} vs vanilla
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate: [status, login, walk, blocks, redstone, placement]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build
        run: cargo build --release
      - name: Pin latest vanilla release
        run: cargo run --release -p doppel-oracle -- pin
      - name: Differential ${{ matrix.gate }} test
        run: cargo run --release -p doppel-oracle -- parity-${{ matrix.gate }}

  capture-vanilla:
    name: capture - vanilla login transcript
    needs: check
    runs-on: ubuntu-latest
    # The strict-decode step adds a vanilla boot plus three live Doppel
    # sessions on top of the existing captures.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build
        run: cargo build --release
      - name: Pin latest vanilla release
        run: cargo run --release -p doppel-oracle -- pin
      - name: Extract block registry
        run: cargo run --release -p doppel-oracle -- registry
      - name: Record vanilla login transcript
        run: cargo run --release -p doppel-oracle -- capture-vanilla-login captures/vanilla-login.jsonl captures/blobs
      - name: Run first tick-stepped scenario
        run: cargo run --release -p doppel-oracle -- scenario captures/scenario.jsonl
      - name: Strict-decode every clientbound frame
        run: cargo run --release -p doppel-oracle -- strict-decode
      - name: Print strict-decode report
        if: always()
        run: cat target/oracle/strict-decode/report.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanilla-login-transcript
          path: |
            captures/vanilla-login.jsonl
            captures/blobs
            captures/scenario.jsonl
            pins/blocks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-decode-report
          path: target/oracle/strict-decode/

  parity-break:
    name: parity - break vs vanilla
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build
        run: cargo build --release
      - name: Pin latest vanilla release
        run: cargo run --release -p doppel-oracle -- pin
      - name: Differential break test
        run: cargo run --release -p doppel-oracle -- parity-break

  parity-survival:
    name: parity - survival vs vanilla
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build
        run: cargo build --release
      - name: Pin latest vanilla release
        run: cargo run --release -p doppel-oracle -- pin
      - name: Differential survival test
        run: cargo run --release -p doppel-oracle -- parity-survival

  parity-mobs:
    name: parity - mobs vs vanilla
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build
        run: cargo build --release
      - name: Pin latest vanilla release
        run: cargo run --release -p doppel-oracle -- pin
      - name: Differential mobs test
        run: cargo run --release -p doppel-oracle -- parity-mobs

  parity-worldgen:
    name: parity - worldgen structural diff vs vanilla
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build
        run: cargo build --release
      - name: Pin latest vanilla release
        run: cargo run --release -p doppel-oracle -- pin
      - name: Worldgen parity gate
        run: cargo run --release -p doppel-oracle -- parity-worldgen

  parity-worldgen-biome:
    name: parity - biome-locate worldgen diff vs vanilla
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build
        run: cargo build --release
      - name: Pin latest vanilla release
        run: cargo run --release -p doppel-oracle -- pin
      - name: Biome-locate worldgen parity gate
        run: cargo run --release -p doppel-oracle -- parity-worldgen-biome
