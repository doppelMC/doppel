[package]
name = "doppel-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Differential test harness: boots vanilla as the spec oracle and diffs Doppel against it"

[dependencies]
anyhow = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
doppel-protocol = { path = "../doppel-protocol" }
doppel-world = { path = "../doppel-world" }
